name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The notes feed both the in-app "What's new" screen (bundled asset) and version.json.
      - name: Check release notes
        run: |
          NOTES="app/src/main/assets/release-notes/${GITHUB_REF_NAME#v}.json"
          if [ ! -f "$NOTES" ]; then
            echo "::error::Missing $NOTES: write the release notes before tagging (see README, Release section)"
            exit 1
          fi
          jq -e 'type == "object" and (.en | type == "array" and length > 0)' "$NOTES" > /dev/null \
            || { echo "::error::$NOTES must be {\"en\": [...], \"it\": [...]} with at least one English note"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret: see README, Release section"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      # Diagnostics without printing secrets: aliases (masked if equal to KEY_ALIAS), lengths, comparisons.
      - name: Check keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Lengths: KEYSTORE_PASSWORD=${#KEYSTORE_PASSWORD} KEY_ALIAS=${#KEY_ALIAS} KEY_PASSWORD=${#KEY_PASSWORD}"
          if [ "$KEY_PASSWORD" = "$KEYSTORE_PASSWORD" ]; then echo "Passwords: equal"; else echo "Passwords: DIFFERENT"; fi
          echo "Decoded keystore: $(stat -c %s "$RUNNER_TEMP/release.jks") bytes, sha256 $(sha256sum "$RUNNER_TEMP/release.jks" | cut -c1-64)"
          echo "Keystore entries:"
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" 2>&1 | grep -v -i "fingerprint" || true
          if keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "KEY_ALIAS: found"
          else
            echo "::error::KEY_ALIAS does not match any alias in the keystore"
            exit 1
          fi
      - name: Test and build signed release
        env:
          FIREDNS_KEYSTORE: ${{ runner.temp }}/release.jks
          FIREDNS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FIREDNS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FIREDNS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testReleaseUnitTest assembleRelease
      # Fixed name: releases/latest/download/firedns.apk always points to the latest version.
      - run: cp app/build/outputs/apk/release/app-release.apk firedns.apk
      # Read by the in-app updater from releases/latest/download/version.json.
      # versionCode must match the one Gradle used (GITHUB_RUN_NUMBER, see app/build.gradle.kts).
      - name: Write version.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq -n \
            --argjson versionCode "$GITHUB_RUN_NUMBER" \
            --arg versionName "$VERSION" \
            --arg apkUrl "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/firedns.apk" \
            --arg sha256 "$(sha256sum firedns.apk | cut -c1-64)" \
            --slurpfile notes "app/src/main/assets/release-notes/${VERSION}.json" \
            '{versionCode: $versionCode, versionName: $versionName, apkUrl: $apkUrl, sha256: $sha256, notes: $notes[0]}' \
            > version.json
          cat version.json
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            firedns.apk
            version.json
          generate_release_notes: true
