name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret: see README, Release section"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      # Diagnostics without printing secrets: aliases (masked if equal to KEY_ALIAS), lengths, comparisons.
      - name: Check keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Lengths: KEYSTORE_PASSWORD=${#KEYSTORE_PASSWORD} KEY_ALIAS=${#KEY_ALIAS} KEY_PASSWORD=${#KEY_PASSWORD}"
          if [ "$KEY_PASSWORD" = "$KEYSTORE_PASSWORD" ]; then echo "Passwords: equal"; else echo "Passwords: DIFFERENT"; fi
          echo "Decoded keystore: $(stat -c %s "$RUNNER_TEMP/release.jks") bytes, sha256 $(sha256sum "$RUNNER_TEMP/release.jks" | cut -c1-64)"
          echo "Keystore entries:"
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" 2>&1 | grep -v -i "fingerprint" || true
          if keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "KEY_ALIAS: found"
          else
            echo "::error::KEY_ALIAS does not match any alias in the keystore"
            exit 1
          fi
      - name: Test and build signed release
        env:
          FIREDNS_KEYSTORE: ${{ runner.temp }}/release.jks
          FIREDNS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FIREDNS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FIREDNS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testReleaseUnitTest assembleRelease
      # Fixed name: releases/latest/download/firedns.apk always points to the latest version.
      - run: cp app/build/outputs/apk/release/app-release.apk firedns.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: firedns.apk
          generate_release_notes: true
